      #     set -o pipefail
      #     xcodebuild test \
      #       -project <Project>.xcodeproj -scheme <Scheme> \
      #       -destination 'platform=macOS' \
      #       CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # ── Swift Package Manager ────────────────────────────────────────────────
      # - run: swift build
      # - run: swift test

      # ── Node ─────────────────────────────────────────────────────────────────
